name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install embedding generator dependency
        run: python3 -m pip install -r requirements-embeddings.txt

      - name: Test crawler and embedding parsers
        run: python3 -I -m unittest discover -s tools -p 'test_*.py' -v

  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Test matcher
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build
